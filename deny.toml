[graph]
targets = [
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # tract 0.19 is pinned by deep_filter; it only loads the model bundled in the binary.
    { id = "RUSTSEC-2026-0319", reason = "tract-nnef only parses the bundled DeepFilterNet model" },
    { id = "RUSTSEC-2024-0436", reason = "paste is a build-time proc macro pulled in by tract" },
    { id = "RUSTSEC-2026-0217", reason = "anymap2 comes from liquid, a build dependency" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
    "MIT-0",
    "MPL-2.0",
]

[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = [
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
allow = []
# Fronteiras arquiteturais impostas pelo grafo de dependências (CORE-01, UI-01, SRV-01, SRV-05):
deny = [
    { crate = "livekit", wrappers = ["rooms-core"], reason = "CORE-01/UI-01: apenas rooms-core pode depender de livekit" },
    { crate = "libwebrtc", wrappers = ["livekit"], reason = "CORE-01: libwebrtc só pode entrar via livekit dentro de rooms-core" },
    { crate = "livekit-api", wrappers = ["rooms-token-server"], reason = "CORE-01/SRV-01: livekit-api restrito a rooms-token-server" },
    { crate = "eframe", wrappers = ["rooms-client", "egui_kittest"], reason = "UI-01: eframe restrito a rooms-client (egui_kittest só como dev-dependency dele)" },
    { crate = "axum", wrappers = ["rooms-token-server"], reason = "SRV-01: axum restrito a rooms-token-server" },
    { crate = "rusqlite", wrappers = ["rooms-token-server"], reason = "SRV-05: rusqlite restrito a rooms-token-server" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = [
    # Pinned by rev in Cargo.toml for deep_filter (DeepFilterNet 3).
    "https://github.com/Rikorose/DeepFilterNet",
]
