[graph]
targets = [
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no fix; it comes from livekit" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
    "MIT-0",
    "MPL-2.0",
]

[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = [
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
allow = []
# Fronteiras arquiteturais impostas pelo grafo de dependências (CORE-01, UI-01, SRV-01, SRV-05):
deny = [
    { crate = "livekit", wrappers = ["zenha-core"], reason = "CORE-01/UI-01: apenas zenha-core pode depender de livekit" },
    { crate = "libwebrtc", wrappers = ["livekit"], reason = "CORE-01: libwebrtc só pode entrar via livekit dentro de zenha-core" },
    { crate = "eframe", wrappers = ["zenha-client", "egui_kittest"], reason = "UI-01: eframe restrito a zenha-client (egui_kittest só como dev-dependency dele)" },
    { crate = "axum", wrappers = ["zenha-server"], reason = "SRV-01: axum restrito a zenha-server" },
    { crate = "rusqlite", wrappers = ["zenha-server"], reason = "SRV-05: rusqlite restrito a zenha-server" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
