[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
zenha-protocol = { path = "crates/zenha-protocol" }
zenha-core = { path = "crates/zenha-core" }

anyhow = "1.0"
argon2 = "=0.6.0"
async-trait = "0.1"
axum = "0.8"
cc = "1.11"
directories = "6.0"
dotenvy = "0.15"
eframe = "0.37"
egui_kittest = { version = "0.37", features = ["eframe"] }
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
livekit = { version = "=0.11.0", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11.1", default-features = false }
subtle = "2.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rfd = { version = "0.18", default-features = false }
rusqlite = { version = "0.43.0", features = ["bundled"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4"] }
wasapi = "=0.27.0"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winresource = "=0.1.34"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Proibições já ativas no projeto (GER-01)
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unwrap_used = "warn"

# Segurança de FFI e supressões documentadas (CORE-03, GER-08)
undocumented_unsafe_blocks = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Async, concorrência e memória (CORE-06, CORE-08, CORE-09)
large_futures = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
manual_let_else = "warn"
inconsistent_struct_constructor = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
webrtc-sys = { git = "https://github.com/Pedroklg/rust-sdks", rev = "ba6c4d35e41968cedd370f64a2d18142a6956243" }
libwebrtc = { git = "https://github.com/Pedroklg/rust-sdks", rev = "ba6c4d35e41968cedd370f64a2d18142a6956243" }
livekit = { git = "https://github.com/Pedroklg/rust-sdks", rev = "ba6c4d35e41968cedd370f64a2d18142a6956243" }
