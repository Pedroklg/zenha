[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
exclude = ["patches"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rooms-protocol = { path = "crates/rooms-protocol" }
rooms-core = { path = "crates/rooms-core" }

anyhow = "1.0"
argon2 = "=0.6.0"
async-trait = "0.1"
axum = "0.8"
directories = "6.0"
dotenvy = "0.15"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = ["tract", "default-model"] }
eframe = "0.37"
futures-util = { version = "0.3", default-features = false }
global-hotkey = "=0.10.0"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
ndarray = "0.15"
nnnoiseless = { version = "0.5.2", default-features = false }
livekit = { version = "=0.10.1", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }
livekit-api = { version = "=0.10.1", default-features = false, features = ["services", "access-token", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rfd = { version = "0.18", default-features = false }
rusqlite = { version = "0.42.0", features = ["bundled"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "=0.26.1"
uuid = { version = "1.10", features = ["v4"] }
wasapi = "=0.27.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winresource = "=0.1.34"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Proibições já ativas no projeto (GER-01)
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unwrap_used = "warn"

# Segurança de FFI e supressões documentadas (CORE-03, GER-08)
undocumented_unsafe_blocks = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Async, concorrência e memória (CORE-06, CORE-08, CORE-09)
large_futures = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
manual_let_else = "warn"
inconsistent_struct_constructor = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
webrtc-sys = { path = "patches/webrtc-sys" }
libwebrtc = { path = "patches/libwebrtc" }
