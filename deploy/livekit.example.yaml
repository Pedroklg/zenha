port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  # On Azure VMs the NIC only sees the private VNet IP (10.10.1.x) behind 1:1 NAT.
  # With use_external_ip: true, LiveKit discovers the public IPv4 address via STUN.
  # To pin the public IP explicitly without STUN, set use_external_ip: false and
  # uncomment node_ip below (use_external_ip: true overrides node_ip):
  use_external_ip: true
  # node_ip: 203.0.113.10
keys:
  CHAVE_DE_PRODUCAO: SEGREDO_DE_PRODUCAO
room:
  auto_create: true
  empty_timeout: 300
logging:
  level: info
