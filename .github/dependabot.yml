version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned to exact versions intentionally due to frequent breaking SDK changes.
      - dependency-name: "livekit"
      - dependency-name: "livekit-api"
      - dependency-name: "libwebrtc"
      # Must match the ndarray version used by the DeepFilterNet crates.
      - dependency-name: "ndarray"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
