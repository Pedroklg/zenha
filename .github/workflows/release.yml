name: release

# Run from main: gh workflow run release.yml -f version=0.1.2
# Running on main keeps the release build cache in main's scope, so the next release reuses it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, matching [workspace.package].version (for example 0.1.2)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version, tag and CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          $tagVersion = $env:VERSION
          if ($tagVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Version '$tagVersion' must look like 1.2.3"
          }
          git ls-remote --exit-code --tags origin "refs/tags/v$tagVersion" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Tag v$tagVersion already exists" }
          $inWorkspacePkg = $false
          $workspaceVersion = $null
          foreach ($line in Get-Content Cargo.toml) {
            $trimmed = $line.Trim()
            if ($trimmed -match '^\[(.+)\]$') {
              $inWorkspacePkg = ($Matches[1] -eq 'workspace.package')
            } elseif ($inWorkspacePkg -and $trimmed -match '^version\s*=\s*"([^"]+)"') {
              $workspaceVersion = $Matches[1]
              break
            }
          }
          if (-not $workspaceVersion) {
            throw 'Could not read [workspace.package].version from Cargo.toml'
          }
          if ($tagVersion -ne $workspaceVersion) {
            throw "Version '$tagVersion' does not match workspace version '$workspaceVersion'"
          }
          # The ci workflow already ran fmt, clippy and tests on this commit; wait for it instead of repeating them.
          $deadline = (Get-Date).AddMinutes(60)
          while ($true) {
            $runs = gh run list --workflow ci.yml --commit $env:GITHUB_SHA --json status,conclusion | ConvertFrom-Json
            if ($runs | Where-Object { $_.conclusion -eq 'success' }) { break }
            if (-not ($runs | Where-Object { $_.status -ne 'completed' })) {
              throw "ci has not passed for $env:GITHUB_SHA"
            }
            if ((Get-Date) -gt $deadline) { throw 'timed out waiting for ci' }
            Start-Sleep -Seconds 30
          }
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $paths = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $found = $paths | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc -and -not $found) {
            choco install innosetup -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package release artifacts
        shell: cmd
        run: scripts\package.cmd
        env:
          ZENHA_DEFAULT_SERVER: ${{ vars.ZENHA_DEFAULT_SERVER }}
          ZENHA_RELEASES_REPO: ${{ github.repository }}
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.version }}"
          $tag = "v$version"
          $zip = "dist\Zenha-$version-windows-x64.zip"
          $setup = "dist\Zenha-$version-windows-x64-setup.exe"
          if (-not (Test-Path $zip)) { throw "Missing artifact: $zip" }
          if (-not (Test-Path $setup)) { throw "Missing artifact: $setup" }
          gh release create $tag $setup $zip --target $env:GITHUB_SHA --title "Zenha $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A tag created with GITHUB_TOKEN does not start other workflows, so ask for the server image explicitly.
          gh workflow run server-image.yml --ref main -f tag=$tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
